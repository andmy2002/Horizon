name: Daily Horizon Summary

on:
  
  workflow_dispatch:      # Allow manual trigger

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          # Map secrets to environment variables expected by config.json
          # Modify these based on your data/config.github.json provider settings
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: uv run horizon --hours 24

      - name: Upload Horizon reports
        uses: actions/upload-artifact@v4
        with:
          name: horizon-reports
          path: data/summaries/*.md
          if-no-files-found: error

      - name: Send reports to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=(data/summaries/*.md)

           if (( ${#reports[@]} == 0 )); then
             echo "没有找到日报文件"
             exit 1
           fi

           for report in "${reports[@]}"; do
             curl --silent --show-error --fail-with-body \
               --connect-timeout 20 --max-time 120 \
               -X POST \
               "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
               --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
               --form-string "caption=Horizon 每日新闻" \
               -F "document=@${report}" \
               | python -c 'import json,sys; r=json.load(sys.stdin); sys.exit(0 if r.get("ok") else "Telegram 发送失败")'
           done

